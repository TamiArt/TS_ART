<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-labelledby="title desc">
<title id="title">Шаг 5. Сравнение с натурой</title><desc id="desc">Два одинаково освещённых шара рядом для сравнения тональных отношений.</desc>
<defs>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#eee8dc"/></linearGradient>
<radialGradient id="ball" cx="27%" cy="20%" r="78%"><stop stop-color="#fffef9"/><stop offset=".25" stop-color="#e6e2d8"/><stop offset=".55" stop-color="#a6a39a"/><stop offset=".82" stop-color="#5f5e58"/><stop offset="1" stop-color="#393a36"/></radialGradient>
<linearGradient id="cast"><stop stop-color="#57564f" stop-opacity=".05"/><stop offset=".6" stop-color="#55534d" stop-opacity=".6"/><stop offset="1" stop-color="#55534d" stop-opacity=".02"/></linearGradient>
<radialGradient id="shine"><stop stop-color="#fffef9" stop-opacity=".98"/><stop offset="1" stop-color="#fffef9" stop-opacity="0"/></radialGradient>
<filter id="paperGrain" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="9" result="n"/><feColorMatrix in="n" type="saturate" values="0" result="mono"/><feComponentTransfer><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#537e98" stroke-width="1.4"/></marker>
</defs>
<rect width="640" height="460" rx="12" fill="url(#paper)"/>
<path d="M35 370Q180 361 300 369T605 365" fill="none" stroke="#aaa398" stroke-width="1.4"/>

<g filter="url(#paperGrain)"><ellipse cx="203" cy="340" rx="102.92" ry="19" fill="url(#cast)"/><circle cx="190" cy="248" r="83" fill="url(#ball)" stroke="#56534d" stroke-width="1.7"/><ellipse cx="152" cy="205" rx="38" ry="31" fill="url(#shine)"/><path d="M121.94 208.16q18 -49 62 -63m-72 92q7 -39 29 -59m-13 139q15 35 48 46m-20 -24q24 26 51 31" fill="none" stroke="#5d5a53" stroke-width="1.15" opacity=".65"/><path d="M130.24 199.86q20 -29 47 -35m-56 59l-9 21m20 -40l-10 19m-4 116l18 14m-3 -22l19 17m-1 -24l17 15" fill="none" stroke="#68645c" stroke-width=".8" opacity=".55"/></g>
<g filter="url(#paperGrain)"><ellipse cx="463" cy="340" rx="102.92" ry="19" fill="url(#cast)"/><circle cx="450" cy="248" r="83" fill="url(#ball)" stroke="#56534d" stroke-width="1.7"/><ellipse cx="412" cy="205" rx="38" ry="31" fill="url(#shine)"/><path d="M381.94 208.16q18 -49 62 -63m-72 92q7 -39 29 -59m-13 139q15 35 48 46m-20 -24q24 26 51 31" fill="none" stroke="#5d5a53" stroke-width="1.15" opacity=".65"/><path d="M390.24 199.86q20 -29 47 -35m-56 59l-9 21m20 -40l-10 19m-4 116l18 14m-3 -22l19 17m-1 -24l17 15" fill="none" stroke="#68645c" stroke-width=".8" opacity=".55"/></g>
<text x="130" y="125" fill="#19364d" font-size="21" font-family="Georgia,serif" font-style="italic">Натура</text><text x="397" y="125" fill="#19364d" font-size="21" font-family="Georgia,serif" font-style="italic">Рисунок</text>
<path d="M274 231H362" stroke="#537e98" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M362 247H274" stroke="#537e98" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="185" y="414" fill="#537e98" font-size="19" font-family="Georgia,serif">Сравни светлоту и тень</text>

</svg>