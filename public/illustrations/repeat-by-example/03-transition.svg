 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#f1ece1"/></linearGradient>
 <radialGradient id="sphere" cx="27%" cy="20%" r="78%"><stop stop-color="#fffef9"/><stop offset=".28" stop-color="#d9d5cb"/><stop offset=".62" stop-color="#9d9a92"/><stop offset=".86" stop-color="#575751"/><stop offset="1" stop-color="#343630"/></radialGradient>
 <linearGradient id="shadow" x1="0" y1="0" x2="1" y2=".25"><stop stop-color="#a6a198" stop-opacity=".3"/><stop offset=".55" stop-color="#55534d" stop-opacity=".75"/><stop offset="1" stop-color="#3b3a35" stop-opacity=".05"/></linearGradient>
