<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-labelledby="title desc">
<title id="title">Шаг 3. Переход света в тень</title><desc id="desc">Плавный тональный переход по округлой поверхности шара.</desc>
<defs>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#eee8dc"/></linearGradient>
<radialGradient id="ball" cx="27%" cy="20%" r="78%"><stop stop-color="#fffef9"/><stop offset=".25" stop-color="#e6e2d8"/><stop offset=".55" stop-color="#a6a39a"/><stop offset=".82" stop-color="#5f5e58"/><stop offset="1" stop-color="#393a36"/></radialGradient>
<linearGradient id="cast"><stop stop-color="#57564f" stop-opacity=".05"/><stop offset=".6" stop-color="#55534d" stop-opacity=".6"/><stop offset="1" stop-color="#55534d" stop-opacity=".02"/></linearGradient>
<radialGradient id="shine"><stop stop-color="#fffef9" stop-opacity=".98"/><stop offset="1" stop-color="#fffef9" stop-opacity="0"/></radialGradient>
<filter id="paperGrain" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="9" result="n"/><feColorMatrix in="n" type="saturate" values="0" result="mono"/><feComponentTransfer><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#537e98" stroke-width="1.4"/></marker>
</defs>
<rect width="640" height="460" rx="12" fill="url(#paper)"/>
<path d="M35 370Q180 361 300 369T605 365" fill="none" stroke="#aaa398" stroke-width="1.4"/>

<g filter="url(#paperGrain)"><ellipse cx="353" cy="369" rx="143.84" ry="19" fill="url(#cast)"/><circle cx="340" cy="244" r="116" fill="url(#ball)" stroke="#56534d" stroke-width="1.7"/><ellipse cx="302" cy="201" rx="38" ry="31" fill="url(#shine)"/><path d="M244.88 188.32q18 -49 62 -63m-72 92q7 -39 29 -59m-13 139q15 35 48 46m-20 -24q24 26 51 31" fill="none" stroke="#5d5a53" stroke-width="1.15" opacity=".65"/><path d="M256.48 176.72q20 -29 47 -35m-56 59l-9 21m20 -40l-10 19m-4 116l18 14m-3 -22l19 17m-1 -24l17 15" fill="none" stroke="#68645c" stroke-width=".8" opacity=".55"/></g>
<path d="M429 154Q468 204 451 252Q444 279 425 301" stroke="#537e98" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="410" y="111" fill="#537e98" font-size="36" font-family="Georgia,serif" font-style="italic">Переход</text>
<path d="M385 139Q422 174 430 216M395 145Q432 181 439 220M404 154Q442 190 448 226" stroke="#66635b" stroke-width="1" fill="none" opacity=".38"/>

</svg>